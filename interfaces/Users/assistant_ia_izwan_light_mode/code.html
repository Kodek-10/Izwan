<!DOCTYPE html><html class="light" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Izwan - Assistant AI</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Inter:wght@400;600&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body {
            background-color: #F7F4F4; /* White Smoke Base */
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(240,184,197,0.15) 0%, transparent 25%),
                radial-gradient(circle at 0% 100%, rgba(204,142,156,0.1) 0%, transparent 25%);
            background-attachment: fixed;
        }
        
        /* Custom Scrollbar for the chat area */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #d5c2c5;
            border-radius: 20px;
        }
        
        .glass-panel {
            box-shadow: 0px 10px 40px rgba(85, 40, 52, 0.12);
        }
    </style>
</head>
<body class="h-screen w-full overflow-hidden flex font-body-md text-body-md text-on-surface antialiased relative">
<!-- Blurred Background Context (Simulating the main app behind the overlay) -->
<div class="absolute inset-0 z-0 opacity-40 grayscale-[20%] blur-sm pointer-events-none flex flex-col p-margin-desktop gap-lg">
<!-- Mock Content -->
<div class="w-full h-16 bg-surface border border-outline-variant rounded-lg"></div>
<div class="flex gap-lg h-full">
<div class="w-1/4 h-full bg-surface border border-outline-variant rounded-lg"></div>
<div class="w-3/4 h-full bg-surface border border-outline-variant rounded-lg"></div>
</div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full h-full p-4 md:p-margin-desktop pointer-events-none">
<!-- Floating Assistant Panel -->
<div class="absolute bottom-4 right-4 md:bottom-10 md:right-10 w-[calc(100%-2rem)] md:w-[440px] h-[calc(100dvh-2rem)] md:h-[680px] max-h-[800px] flex flex-col bg-surface/85 backdrop-blur-xl border border-outline-variant rounded-[24px] overflow-hidden glass-panel pointer-events-auto transform transition-all duration-500 origin-bottom-right">
<!-- Header -->
<header class="flex items-center justify-between p-lg border-b border-surface-dim bg-surface/50">
<div class="flex items-center gap-md">
<div class="relative w-10 h-10 rounded-full overflow-hidden bg-primary-container flex items-center justify-center shrink-0">
<img class="w-full h-full object-cover" data-alt="A highly detailed, abstract minimalist 3D rendering of an orb glowing with a soft, ethereal wine-red light. The orb is set against a pristine white studio background. The lighting is high-key and soft, creating a premium, modern light-mode tech aesthetic. The mood is calm, intelligent, and focused." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBllSMSuXxS-9DM8B6oyY6WFKExLQY9ait0cn0WOPkpmo_B2apHNvKXTPN-QOVF5HiXwH6o4mfQ1tz_Naq_W4mOsNer0juiI8FsTuRzfXPk7WRcvwg-6rx2qQyyDJA3L0XAp9NvrIcnhehO_-auEzaq5hoAtM-7qTxMlsZa9Bj8vrUTnBf5vf4T8pAf2wYDG6oVfz_N81U-9zmDawcUEFvdcu-g9xmssLQ631C_qwtXLf9Mti3WBZy1R3VpxV4x0VFABXqLPIbaYcc">
<!-- Fallback icon if image fails -->
<span class="material-symbols-outlined absolute text-on-primary-container" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface leading-tight tracking-tight">Assistant</h2>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Izwan AI</span>
</div>
</div>
<button class="p-2 rounded-full hover:bg-surface-dim text-on-surface-variant transition-colors group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">close</span>
</button>
</header>
<!-- Chat Area -->
<div class="flex-1 overflow-y-auto chat-scroll p-lg flex flex-col gap-lg bg-gradient-to-b from-transparent to-surface-container-lowest/30">
<!-- AI Greeting -->
<div class="flex gap-md max-w-[90%]">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center shrink-0 mt-1 border border-primary-container/10">
<span class="material-symbols-outlined text-primary text-[18px]">temp_preferences_custom</span>
</div>
<div class="flex flex-col gap-2">
<div class="bg-surface-container-lowest border border-outline-variant rounded-2xl rounded-tl-sm p-md shadow-sm">
<p class="font-body-md text-body-md text-on-surface">Bonjour ! Comment puis-je vous aider aujourd'hui avec votre code ou vos données ?</p>
</div>
</div>
</div>
<!-- Suggested Actions (Bento Grid Style) -->
<div class="mt-4 flex flex-col gap-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-2">Suggestions</span>
<div class="grid grid-cols-1 gap-sm">
<!-- Suggestion 1 -->
<button class="group relative flex flex-col items-start text-left p-md bg-surface border border-outline-variant rounded-xl hover:border-primary hover:bg-surface-bright transition-all duration-300 shadow-sm hover:shadow-md">
<div class="flex items-center gap-2 mb-2">
<div class="w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">code</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface font-semibold group-hover:text-primary transition-colors">Optimise mon dernier snippet</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80 text-xs">Analyse et améliore la performance du code sélectionné.</p>
</button>
<!-- Suggestion 2 -->
<button class="group relative flex flex-col items-start text-left p-md bg-surface border border-outline-variant rounded-xl hover:border-primary hover:bg-surface-bright transition-all duration-300 shadow-sm hover:shadow-md">
<div class="flex items-center gap-2 mb-2">
<div class="w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">lightbulb</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface font-semibold group-hover:text-primary transition-colors">Explique ce code</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80 text-xs">Génère une documentation claire pour le bloc actif.</p>
</button>
</div>
</div>
<!-- Spacer to push input down if content is short -->
<div class="flex-1"></div>
</div>
<!-- Input Area -->
<div class="p-lg bg-surface/90 backdrop-blur-md border-t border-surface-dim">
<div class="relative flex items-end gap-2 bg-surface-container-lowest border border-outline-variant rounded-xl p-2 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all shadow-sm">
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 py-2 pl-2 chat-scroll max-h-[120px]" placeholder="Demandez à l'assistant..." rows="1" style="min-height: 40px;"></textarea>
<div class="flex gap-1 shrink-0 pb-1">
<button class="p-2 rounded-lg text-on-surface-variant hover:bg-surface-dim hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">attach_file</span>
</button>
<button class="p-2 rounded-lg bg-primary text-on-primary shadow-sm hover:bg-primary-container hover:shadow-md transition-all">
<span class="material-symbols-outlined text-[20px] ml-0.5" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<div class="text-center mt-3">
<span class="font-body-sm text-[11px] text-on-surface-variant/60">L'IA peut faire des erreurs. Vérifiez les informations.</span>
</div>
</div>
</div>
</main>
<!-- Trigger Button (Representing the orb that was clicked) -->
<div class="fixed bottom-4 right-4 md:bottom-10 md:right-10 z-0 pointer-events-none opacity-0">
<!-- Kept in DOM structurally but hidden since panel is open -->
<button class="w-14 h-14 rounded-full bg-primary text-on-primary shadow-xl flex items-center justify-center">
<span class="material-symbols-outlined">spark</span>
</button>
</div>
</body></html>
